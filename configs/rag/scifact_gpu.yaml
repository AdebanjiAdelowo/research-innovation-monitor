# RQ4 with an open 7B model on a CUDA GPU: all SciFact test claims. Retrieval settings,
# judge and threshold as in the local run (selected on dev data only).
experiment: rag_scifact_gpu
seed: 13
device: auto
dataset: scifact
n_questions: 300
question_template: "Is the following claim supported by the evidence? Claim: {query}"
encoder:
  name: bge-small
  model_id: BAAI/bge-small-en-v1.5
  revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
  query_prefix: "Represent this sentence for searching relevant passages: "
  max_seq_length: 512
k1: 1.2
b: 0.5
fusion: convex
alpha: 0.6
max_passages: 5
max_passage_words: 220
max_tokens: 300
providers:
  - name: extractive
    kind: extractive
  - name: qwen2.5-7b
    kind: transformers
    options:
      model_id: Qwen/Qwen2.5-7B-Instruct
      revision: a09a35458c702b33eeacc393d103063234e8bc28
      device: cuda
      dtype: float16
judge:
  kind: nli
  model_id: MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli
  revision: 6f5cf0a2b59cabb106aca4c287eed12e357e90eb
  threshold: 0.4
